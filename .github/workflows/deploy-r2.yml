name: Deploy to Cloudflare R2 (incremental)

# Deploy INCREMENTALE del sito su Cloudflare R2 via `rclone sync`: carica SOLO i
# file nuovi/cambiati e cancella i rimossi (delta reale), invece del full-snapshot
# di GitHub Pages che a ~31k file falliva a intermittenza in "syncing_files".
# Vedi docs/DEPLOY_R2.md per il setup (bucket, custom domain, secret, nameserver).
#
# Per ora è SOLO workflow_dispatch (manuale) e inerte finché non ci sono i secret
# R2: così non gira né fallisce sui push. Dopo la verifica, abilitare i trigger
# `push`/`schedule` (o farlo chiamare dalla nightly) e ritirare i deploy Pages.

on:
  workflow_dispatch:
  # Da abilitare DOPO la verifica del deploy su R2:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-r2
  cancel-in-progress: true

jobs:
  deploy-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uv sync

      # Rigenera le pagine #15 dai dati committati (come nel deploy Pages).
      - name: Build per-entity & area SEO pages + sitemap index (#15)
        run: uv run python3 scripts/build_entity_pages.py --country IT --no-domain-aliases

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      # Sync incrementale verso R2. `--checksum` confronta per HASH (non per
      # mtime): fondamentale, perché il checkout rigenera gli mtime a ogni run e
      # senza checksum rclone ri-caricherebbe TUTTO. Così l'upload notturno è il
      # solo delta (gli enti che cambiano classificazione + vicini + hub + sitemap).
      - name: Sync sito → R2 (incrementale, solo delta)
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_ACL: private
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::Secret R2 mancanti (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET). Vedi docs/DEPLOY_R2.md."
            exit 1
          fi
          # Sincronizza SOLO i file servibili del sito (esclude codice/dati interni/cache).
          # `data/**` esclude la dir interna (seeds/dns_cache/reports); `data*.json` alla
          # ROOT restano inclusi (sono i file pubblici del frontend).
          rclone sync . "r2:${R2_BUCKET}" \
            --checksum --fast-list --transfers=48 --checkers=48 \
            --exclude '.git/**' --exclude '.github/**' \
            --exclude 'data/**' --exclude 'scripts/**' --exclude 'src/**' \
            --exclude 'tests/**' --exclude 'docs/**' \
            --exclude '**/__pycache__/**' --exclude '.ruff_cache/**' --exclude '_scratch/**' \
            --exclude '*.py' --exclude '*.md' --exclude 'uv.lock' --exclude 'pyproject.toml' \
            --exclude '.pre-commit-config.yaml' --exclude 'conftest.py' --exclude '.gitignore' \
            --exclude 'CNAME' --exclude '.nojekyll' \
            --stats-one-line --stats=15s
          echo "✅ Sync R2 completato (solo delta caricato)."
